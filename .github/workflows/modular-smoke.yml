name: Minimal Composer Modular Smoke Test
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v0.5.0 static smoke test
        run: node tests/smoke-v0.5.0.mjs
