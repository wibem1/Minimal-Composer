name: Minimal Composer 0.7 Clean Check
on:
  push:
    branches: [v0.7-clean-engine22]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static invariants
        run: |
          grep -q "const ENGINE_VERSION='2.2.0'" composition-engine-v2.2.js
          grep -q "Du bist ein eigenständiger Komponist." composition-engine-v2.2.js
          grep -q "Composition Engine 2.2" index.html
          ! grep -q "vermeide mechanische" composition-engine-v2.2.js
          ! grep -q "Gestik, Spannung, Bewegung, Dichte" composition-engine-v2.2.js
          ! grep -q "Standard – Engine" index.html
          ! grep -q "Sound-first – Engine" index.html
      - name: JavaScript syntax
        run: |
          node --check composition-engine-v2.2.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          scripts=re.findall(r"<script(?: [^>]*)?>([\s\S]*?)</script>",s)
          for i,x in enumerate(scripts):
              if x.strip(): Path(f"/tmp/inline-{i}.js").write_text(x)
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
