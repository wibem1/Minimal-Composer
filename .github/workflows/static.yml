name: Test and deploy Minimal Composer to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax check
        shell: bash
        run: |
          for f in *.js; do node --check "$f"; done
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path("index.html").read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          for i,s in enumerate(scripts):
              if s.strip():
                  pathlib.Path(f"/tmp/minimal-inline-{i}.js").write_text(s)
          PY
          for f in /tmp/minimal-inline-*.js; do [ -e "$f" ] && node --check "$f"; done

      - name: Startup smoke test
        shell: bash
        run: |
          grep -Eq "Version 0\.[5-9]\.[0-9]+" index.html
          grep -q "const APP_VERSION=" index.html
          grep -q "id=\"compose\"" index.html
          grep -q "id=\"model\"" index.html
          grep -q "function setDefaultModel" index.html
          grep -q "addEventListener('click'" index.html
          grep -q "const {buildMidi}=window.CompositionEngine;" index.html
          ! grep -q "window.CompositionEngines.standard" index.html

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
