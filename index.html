<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minimal Composer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{max-width:900px;margin:auto;padding:24px 16px 60px}h1{margin:0}.version,.small{font-size:12px;opacity:.7}label{display:block;font-weight:650;margin:16px 0 7px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;padding:10px;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);border-radius:9px;background:Canvas;color:CanvasText}textarea{min-height:130px;resize:vertical;line-height:1.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{padding:9px 14px;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);border-radius:9px;background:color-mix(in srgb,CanvasText 7%,Canvas);color:CanvasText}button.primary{background:CanvasText;color:Canvas;font-weight:700}.status{margin-top:14px;min-height:24px}.card{margin-top:20px;padding:16px;border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:12px;white-space:pre-wrap;line-height:1.5}details{margin-top:18px}summary{cursor:pointer;font-weight:650}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Minimal Composer</h1><div class="version">Version 1.2.0 · ohne Composition Engine</div>
<div class="row"><div><label for="provider">KI</label><select id="provider"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="google">Google</option></select></div><div><label for="model">Modell</label><select id="model"></select></div></div>
<details><summary>Zusätzliche Angaben an die KI</summary><div class="small" style="margin:8px 0">Editierbar und gespeichert. Dieser Text wird zusätzlich zum Kompositionsauftrag gesendet. Sonst nichts.</div><textarea id="extra" placeholder="Zusätzliche Angaben"></textarea></details>
<label for="task">Kompositionsauftrag</label><textarea id="task" placeholder="Kompositionsauftrag"></textarea>
<div class="actions"><button id="compose" class="primary">Komponieren</button><button id="protocol" disabled>Kommunikationsprotokoll</button></div>
<div id="status" class="status"></div><section id="result" class="card" hidden></section>
<details><summary>API-Schlüssel</summary><div class="small" style="margin:8px 0">Die Schlüssel bleiben in diesem Browser.</div><label for="keyOpenAI">OpenAI</label><input id="keyOpenAI" type="password"><label for="keyAnthropic">Anthropic</label><input id="keyAnthropic" type="password"><label for="keyGoogle">Google</label><input id="keyGoogle" type="password"></details>
<dialog id="protocolDialog"><pre id="protocolText" style="white-space:pre-wrap;max-width:80vw;max-height:70vh;overflow:auto"></pre><button id="closeProtocol">Schließen</button></dialog>
</main><script>
(()=>{'use strict';
const APP_VERSION='1.2.0';
const CATALOG={
 openai:[['gpt-6-astra','GPT-6 Astra'],['gpt-5.6-sol','GPT-5.6 Sol'],['gpt-5.6-terra','GPT-5.6 Terra'],['gpt-5.6-luna','GPT-5.6 Luna']],
 anthropic:[['claude-fable-5','Claude Fable 5'],['claude-sonnet-5','Claude Sonnet 5'],['claude-opus-5','Claude Opus 5'],['claude-opus-4-8','Claude Opus 4.8'],['claude-sonnet-4-6','Claude Sonnet 4.6'],['claude-haiku-4-5-20251001','Claude Haiku 4.5']],
 google:[['gemini-3.1-pro-preview','Gemini 3.1 Pro'],['gemini-3.8-flash','Gemini 3.8 Flash'],['gemini-3.7-flash','Gemini 3.7 Flash'],['gemini-3.6-flash','Gemini 3.6 Flash'],['gemini-3.5-flash','Gemini 3.5 Flash'],['gemini-3.1-flash-lite','Gemini 3.1 Flash-Lite'],['gemini-2.5-pro','Gemini 2.5 Pro']]
};
const DEF={openai:'gpt-5.6-sol',anthropic:'claude-fable-5',google:'gemini-3.1-pro-preview'};
const $=id=>document.getElementById(id),provider=$('provider'),model=$('model'),extra=$('extra'),task=$('task'),status=$('status'),result=$('result');
let lastProtocol=null;
function fillModels(){const list=CATALOG[provider.value]||[];model.innerHTML='';for(const [v,l] of list){const o=document.createElement('option');o.value=v;o.textContent=l;model.appendChild(o)}const saved=localStorage.getItem('mct_model_'+provider.value);model.value=list.some(x=>x[0]===saved)?saved:DEF[provider.value]||list[0]?.[0]||''}
function save(){localStorage.setItem('mct_provider',provider.value);localStorage.setItem('mct_model_'+provider.value,model.value);localStorage.setItem('mct_extra',extra.value);localStorage.setItem('mct_task',task.value)}
function key(){return localStorage.getItem('mct_key_'+provider.value)||''}
function request(prompt){
 const m=model.value,k=key();
 if(provider.value==='openai')return{url:'https://api.openai.com/v1/responses',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:{model:m,input:[{role:'user',content:[{type:'input_text',text:prompt}]}],store:false}};
 if(provider.value==='anthropic')return{url:'https://api.anthropic.com/v1/messages',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:{model:m,max_tokens:32768,messages:[{role:'user',content:prompt}]}};
 return{url:'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent?key='+encodeURIComponent(k),headers:{'Content-Type':'application/json'},body:{contents:[{role:'user',parts:[{text:prompt}]}]}};
}
function extract(j){
 if(provider.value==='openai'){if(typeof j.output_text==='string')return j.output_text;return(j.output||[]).flatMap(x=>x.content||[]).map(x=>x.text||'').filter(Boolean).join('\n')}
 if(provider.value==='anthropic')return(j.content||[]).filter(x=>x.type==='text').map(x=>x.text||'').join('\n');
 return(j.candidates||[]).flatMap(x=>x.content?.parts||[]).map(x=>x.text||'').join('\n');
}
async function compose(){
 save();const k=key();if(!k)throw new Error('API-Key für '+provider.value+' fehlt.');if(!task.value.trim())throw new Error('Bitte einen Kompositionsauftrag eingeben.');
 const prompt=[extra.value,task.value].filter(x=>x.length>0).join('\n\n'),q=request(prompt),started=Date.now();
 lastProtocol={appVersion:APP_VERSION,provider:provider.value,model:model.value,prompt,requestBody:q.body};
 status.textContent='Komponiere …';$('compose').disabled=true;
 try{const res=await fetch(q.url,{method:'POST',headers:q.headers,body:JSON.stringify(q.body)}),raw=await res.text();lastProtocol.status=res.status;lastProtocol.elapsedMs=Date.now()-started;if(!res.ok)throw new Error('API '+res.status+': '+raw.slice(0,500));const j=JSON.parse(raw),text=extract(j).trim();if(!text)throw new Error('Die KI-Antwort ist leer.');lastProtocol.response=text;result.textContent=text;result.hidden=false;$('protocol').disabled=false;status.textContent='Fertig.'}finally{$('compose').disabled=false}
}
provider.value=localStorage.getItem('mct_provider')||'openai';fillModels();extra.value=localStorage.getItem('mct_extra')||'';task.value=localStorage.getItem('mct_task')||'';
for(const n of ['OpenAI','Anthropic','Google']){const el=$('key'+n),id=n.toLowerCase();el.value=localStorage.getItem('mct_key_'+id)||'';el.addEventListener('input',()=>localStorage.setItem('mct_key_'+id,el.value))}
provider.addEventListener('change',()=>{fillModels();save()});model.addEventListener('change',save);extra.addEventListener('input',save);task.addEventListener('input',save);
$('compose').addEventListener('click',()=>compose().catch(e=>{status.textContent='Fehler: '+e.message;$('compose').disabled=false}));
$('protocol').addEventListener('click',()=>{$('protocolText').textContent=JSON.stringify(lastProtocol,null,2);$('protocolDialog').showModal()});$('closeProtocol').addEventListener('click',()=>$('protocolDialog').close());
})();
</script></body></html>
